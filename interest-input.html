<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>interest-input | 社团招新平台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="screen screen-plain">
    <header class="masthead masthead-simple">
      <div class="wrap masthead-inner">
        <a class="logo" href="./Home.html">社团招新平台</a>
      </div>
    </header>

    <main class="interest-main">
      <section class="interest-block">
        <h1>你的兴趣</h1>
        <div class="tag-row">
          <span class="chip">摄影</span>
          <span class="chip">绘画</span>
          <span class="chip">音乐</span>
        </div>
      </section>

      <section class="interest-block">
        <h2>你对社团活动的期望</h2>
        <div class="tag-row tag-row-optional">
          <span class="chip">轻松兴趣</span>
          <span class="chip">高投入</span>
          <span class="chip">社交陪伴</span>
        </div>
        <a class="button button-dark button-large button-start" href="./Home.html">开始寻找社团</a>
      </section>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
